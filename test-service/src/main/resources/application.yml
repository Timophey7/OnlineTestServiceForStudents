spring:
  kafka:
    bootstrap-servers: localhost:29092
  cache:
    type: redis
  data:
    redis:
      port: 6379
      host: localhost
      password: ZmRlZWRhc3Nl

  application:
    name: test-service
  datasource:
    url: jdbc:postgresql://localhost:5433/test-service
    username: ${POSTGRES_PASSWORD}
    password: ${POSTGRES_USER}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

server:
  port: 8096

management:
  endpoints.web.exposure.include: 'prometheus, health'
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  prometheus:
    metrics:
      export:
        enabled: true